<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="bg" cx="70%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#4b2a8a"/>
      <stop offset="60%" stop-color="#08090d"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Paths the icons follow (ovals) -->
    <path id="outerPath" d="M610,190 A290,150 0 1 1 30,190 A290,150 0 1 1 610,190"/>
    <path id="innerPath" d="M490,190 A170,85 0 1 1 150,190 A170,85 0 1 1 490,190"/>
  </defs>

  <!-- Background -->
  <rect width="640" height="420" rx="16" fill="url(#bg)"/>

  <!-- Ring lines -->
  <ellipse cx="320" cy="190" rx="290" ry="150" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <ellipse cx="320" cy="190" rx="170" ry="85" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- Center logo with glow -->
  <circle cx="320" cy="190" r="55" fill="#ff7a18" filter="url(#glow)"/>
  <circle cx="320" cy="190" r="55" fill="#0b0b12" stroke="#ff6a3d" stroke-width="3"/>
  <text x="320" y="202" text-anchor="middle" fill="white" font-size="34" font-weight="bold" font-family="Arial">IP</text>

  <!-- Outer ring icons (6 icons, 40 seconds for one turn) -->
  <g>
    <circle r="23" fill="#12131a" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" dy="4" fill="white" font-size="11" font-family="Arial">Node</text>
    <animateMotion dur="40s" begin="0s" repeatCount="indefinite"><mpath href="#outerPath"/></animateMotion>
  </g>
  <g>
    <circle r="23" fill="#12131a" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" dy="4" fill="white" font-size="10" font-family="Arial">GitHub</text>
    <animateMotion dur="40s" begin="-6.6s" repeatCount="indefinite"><mpath href="#outerPath"/></animateMotion>
  </g>
  <g>
    <circle r="23" fill="#12131a" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" dy="4" fill="white" font-size="11" font-family="Arial">HTML</text>
    <animateMotion dur="40s" begin="-13.3s" repeatCount="indefinite"><mpath href="#outerPath"/></animateMotion>
  </g>
  <g>
    <circle r="23" fill="#12131a" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" dy="4" fill="white" font-size="11" font-family="Arial">JS</text>
    <animateMotion dur="40s" begin="-20s" repeatCount="indefinite"><mpath href="#outerPath"/></animateMotion>
  </g>
  <g>
    <circle r="23" fill="#12131a" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" dy="4" fill="white" font-size="11" font-family="Arial">Figma</text>
    <animateMotion dur="40s" begin="-26.6s" repeatCount="indefinite"><mpath href="#outerPath"/></animateMotion>
  </g>
  <g>
    <circle r="23" fill="#12131a" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" dy="4" fill="white" font-size="11" font-family="Arial">PHP</text>
    <animateMotion dur="40s" begin="-33.3s" repeatCount="indefinite"><mpath href="#outerPath"/></animateMotion>
  </g>

  <!-- Inner ring icons (4 icons, opposite direction) -->
  <g>
    <circle r="23" fill="#12131a" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" dy="4" fill="white" font-size="11" font-family="Arial">Vite</text>
    <animateMotion dur="30s" begin="0s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#innerPath"/></animateMotion>
  </g>
  <g>
    <circle r="23" fill="#12131a" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" dy="4" fill="white" font-size="11" font-family="Arial">Vue</text>
    <animateMotion dur="30s" begin="-7.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#innerPath"/></animateMotion>
  </g>
  <g>
    <circle r="23" fill="#12131a" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" dy="4" fill="white" font-size="11" font-family="Arial">CSS</text>
    <animateMotion dur="30s" begin="-15s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#innerPath"/></animateMotion>
  </g>
  <g>
    <circle r="23" fill="#12131a" stroke="#ffffff" stroke-opacity="0.2"/>
    <text text-anchor="middle" dy="4" fill="white" font-size="11" font-family="Arial">Git</text>
    <animateMotion dur="30s" begin="-22.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#innerPath"/></animateMotion>
  </g>

  <!-- Text -->
  <text x="320" y="385" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial">Hi, I'm Pacifique 👋</text>
  <text x="320" y="407" text-anchor="middle" fill="#aaaaaa" font-size="13" font-family="Arial">Web Developer &amp; Vibe Coder</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>